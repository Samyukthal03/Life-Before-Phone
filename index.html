<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Life Before Phone</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EAE1CB;
    --paper-dark:#DCCFAC;
    --ink:#26221B;
    --ink-soft:#5b5344;
    --rust:#A23E2E;
    --teal:#2E6E71;
    --mustard:#D6A03D;
    --gum:#D9829A;
    --steel:#5B6B6E;
    --display: 'Kalam', cursive;
    --mono: 'Space Mono', monospace;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0;padding:0;touch-action:manipulation;}
  body{
    background-color:var(--paper);
    background-image: radial-gradient(rgba(0,0,0,0.035) 1px, transparent 1px);
    background-size:3px 3px;
    color:var(--ink);
    font-family:var(--mono);
    min-height:100vh;
    min-height:100dvh;
    overflow-x:hidden;
  }
  svg.noise-def{position:absolute;width:0;height:0;}
  .grain{
    position:fixed; inset:0; pointer-events:none; z-index:999;
    opacity:0.05; mix-blend-mode:multiply;
  }

  /* ---------- HOME ---------- */
  header.hero{
    padding:44px 20px 24px;
    text-align:center;
  }
  header.hero .eyebrow{
    font-size:12px; letter-spacing:3px; text-transform:uppercase;
    color:var(--ink-soft); margin-bottom:8px;
  }
  header.hero h1{
    font-family:var(--display);
    font-size:clamp(34px,6.5vw,70px);
    margin:0;
    line-height:1.05;
    color:var(--ink);
    transform:rotate(-1deg);
  }
  header.hero h1 span{color:var(--rust);}
  header.hero p{
    max-width:520px; margin:14px auto 0;
    color:var(--ink-soft); font-size:13.5px; line-height:1.5;
  }

  .box{
    max-width:1080px; margin:0 auto; padding:16px 20px 60px;
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(180px,1fr));
    gap:18px 16px;
  }
  .card{
    background:var(--paper-dark);
    border:1px solid rgba(0,0,0,0.12);
    border-radius:4px;
    padding:16px 14px;
    cursor:pointer;
    position:relative;
    box-shadow:0 2px 0 rgba(0,0,0,0.06), 0 8px 16px -10px rgba(0,0,0,0.25);
    transition:transform .18s ease, box-shadow .18s ease;
    min-height:128px;
    display:flex; flex-direction:column; justify-content:flex-end;
  }
  .card:hover{
    transform:translateY(-4px) rotate(var(--r,0deg));
    box-shadow:0 6px 0 rgba(0,0,0,0.08), 0 16px 24px -12px rgba(0,0,0,0.3);
  }
  .card:focus-visible,.pill-btn:focus-visible,.back-btn:focus-visible{
    outline:3px solid var(--rust); outline-offset:3px;
  }
  .card:active{transform:translateY(0) rotate(var(--r,0deg)) scale(.98);}
  .card::before{
    content:'';
    position:absolute; top:-7px; left:50%; transform:translateX(-50%) rotate(-3deg);
    width:34px; height:13px; background:rgba(255,255,255,0.6);
    border:1px solid rgba(0,0,0,0.08);
  }
  .card .num{
    position:absolute; top:8px; right:10px;
    font-size:10px; color:var(--ink-soft); opacity:.6;
  }
  .card .icon{font-size:24px; margin-bottom:8px; display:block;}
  .card h3{
    font-family:var(--display); font-size:18px; margin:0 0 2px; line-height:1.15;
  }
  .card p{margin:0; font-size:10px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.5px;}

  /* ---------- FOOTER ---------- */
  footer.home-footer{
    max-width:1080px;
    margin:0 auto;
    padding:16px 20px 40px;
    border-top:1px dashed rgba(0,0,0,0.15);
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:14px;
    color:var(--ink-soft);
    font-size:12px;
  }
  .footer-left a{
    color:var(--rust);
    text-decoration:none;
    border-bottom:1px solid var(--rust);
    padding-bottom:1px;
  }
  .footer-center{text-align:center; flex:1;}
  .footer-fun{font-size:11px; letter-spacing:1px; margin-bottom:2px; opacity:0.8;}
  .footer-author{font-family:var(--display); font-size:19px; color:var(--ink); font-weight:bold;}

  /* ---------- EXPERIENCE OVERLAY ---------- */
  .stage{
    position:fixed; inset:0; background:var(--paper);
    transform:translateY(100%);
    transition:transform .34s cubic-bezier(.2,.8,.2,1);
    z-index:100; display:flex; flex-direction:column;
    height:100vh; height:100dvh;
  }
  .stage.open{transform:translateY(0);}
  .stage-top{
    display:flex; align-items:center; justify-content:space-between;
    padding:12px 16px; border-bottom:1px solid rgba(0,0,0,.1);
    gap:10px;
  }
  .back-btn{
    font-family:var(--mono); font-size:11.5px; letter-spacing:.5px;
    background:var(--ink); color:var(--paper); border:none;
    padding:8px 12px; border-radius:3px; cursor:pointer; text-transform:uppercase;
    white-space:nowrap;
  }
  .back-btn:hover{background:var(--rust);}
  .stage-title{
    font-family:var(--display); font-size:20px; margin:0; text-align:center; flex:1;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .stage-spacer{width:80px;}
  .stage-hint{
    text-align:center; font-size:11px; color:var(--ink-soft); padding:6px 14px 4px; min-height:16px; line-height:1.3;
  }
  .stage-body{
    flex:1; position:relative; display:flex; align-items:center; justify-content:center;
    overflow:hidden; padding:8px 12px;
  }
  .exp-canvas-wrap{
    position:relative; width:min(760px,94vw); height:min(440px,58vh);
    background:#fff; border:1px solid rgba(0,0,0,.12);
    box-shadow:0 10px 25px -10px rgba(0,0,0,.25);
    border-radius:4px; overflow:hidden;
    touch-action:none;
  }
  .exp-canvas-wrap canvas{display:block; width:100%; height:100%; touch-action:none;}
  .ctrl-row{
    display:flex; gap:8px; justify-content:center; padding:10px 14px 20px; flex-wrap:wrap;
  }
  .pill-btn{
    font-family:var(--mono); font-size:11px; background:var(--paper-dark);
    border:1px solid rgba(0,0,0,.15); padding:7px 12px; border-radius:18px; cursor:pointer;
  }
  .pill-btn:hover{background:var(--mustard); border-color:var(--mustard);}
  .pill-btn:active{transform:translateY(1px) scale(.97);}
  .status{
    position:absolute; top:8px; left:8px; font-size:10.5px; background:rgba(255,255,255,.9);
    padding:3px 8px; border-radius:3px; letter-spacing:.4px; z-index:10; pointer-events:none;
  }
  .celebrate{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-family:var(--display); font-size:28px; color:var(--rust); background:rgba(255,255,255,.7);
    opacity:0; pointer-events:none; transition:opacity .3s; z-index:20; text-align:center; padding:16px;
  }
  .celebrate.show{opacity:1;}
  .spark{
    position:absolute; width:7px; height:7px; border-radius:50%; pointer-events:none;
    animation:pop .55s ease-out forwards;
  }
  @keyframes pop{to{transform:translate(var(--x),var(--y)) scale(0);opacity:0;}}

  @media(max-width:560px){
    header.hero{padding:30px 14px 16px;}
    .box{grid-template-columns:repeat(2,1fr); gap:12px 10px; padding:10px 12px 40px;}
    .card{min-height:112px; padding:12px 10px;}
    .stage-spacer{display:none;}
    .stage-title{font-size:17px;}
    .exp-canvas-wrap{height:min(390px,52vh);}
    footer.home-footer{flex-direction:column; align-items:center; text-align:center; gap:10px;}
  }
</style>
</head>
<body>

<svg class="noise-def"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/></filter></svg>
<svg class="grain"><rect width="100%" height="100%" filter="url(#n)"/></svg>

<header class="hero">
  <div class="eyebrow">a small museum of things we used to do</div>
  <h1>Life Before <span>Phone</span></h1>
  <p>Before the glass rectangle, boredom had texture. Tap a memory below and play with it again.</p>
</header>

<main class="box" id="box"></main>

<footer class="home-footer">
  <div class="footer-left">
    <div>Got thoughts or feedback?</div>
    <a href="mailto:samyukthanathan03@gmail.com">samyukthanathan03@gmail.com</a>
  </div>
  <div class="footer-center">
    <div class="footer-fun">Made with fun</div>
    <div class="footer-author">Made by Samyuktha</div>
  </div>
  <div style="min-width:120px;"></div>
</footer>

<!-- STAGE -->
<div class="stage" id="stage">
  <div class="stage-top">
    <button class="back-btn" id="backBtn">← Back</button>
    <h2 class="stage-title" id="stageTitle"></h2>
    <div class="stage-spacer"></div>
  </div>
  <div class="stage-hint" id="stageHint"></div>
  <div class="stage-body" id="stageBody"></div>
  <div class="ctrl-row" id="stageControls"></div>
</div>

<script>
const ITEMS = [
  {id:'sand', icon:'🪴', title:'Sand food', desc:'sand pot, water & garnish'},
  {id:'swirl', icon:'🛁', title:'Water tub swirl', desc:'swirl the tub with finger/mouse'},
  {id:'rain', icon:'🌧️', title:'Raindrops on window', desc:'race two drops'},
  {id:'stone', icon:'🪨', title:'Kicking stones', desc:'tap the stone to kick'},
  {id:'ants', icon:'🐜', title:'Watching ants', desc:'drop a crumb'},
  {id:'dvd', icon:'📀', title:'DVD hitting corner', desc:'nudge it to a corner'},
  {id:'pambaram', icon:'🌀', title:'Pambaram – top', desc:'pull cord to spin'},
  {id:'pencil', icon:'✏️', title:'Eraser pencil dots', desc:'poke black dots into eraser'},
  {id:'magnets', icon:'🧲', title:'Two magnets', desc:'drag close to repel / attract'},
  {id:'chips', icon:'🧤', title:'Chips on fingers', desc:'drag cone chips onto fingertips'},
  {id:'tornado', icon:'🌪️', title:'Bottle tornado', desc:'swirl bottle in circles'},
  {id:'gum', icon:'❤️', title:'Peel glue heart', desc:'pour, dry 10s & peel whole'}
];

const box = document.getElementById('box');
ITEMS.forEach((it,i)=>{
  const c = document.createElement('div');
  c.className='card';
  c.setAttribute('role','button');
  c.setAttribute('tabindex','0');
  c.setAttribute('aria-label',`Play ${it.title}: ${it.desc}`);
  const rot = (i%2===0?-1:1)*(1+ (i%3));
  c.style.setProperty('--r', rot+'deg');
  c.style.transform = `rotate(${rot}deg)`;
  c.innerHTML = `<span class="num">${String(i+1).padStart(2,'0')}</span>
    <span class="icon">${it.icon}</span>
    <h3>${it.title}</h3><p>${it.desc}</p>`;
  c.addEventListener('click',()=>openExp(it.id));
  c.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){e.preventDefault();openExp(it.id);} });
  box.appendChild(c);
});

const stage=document.getElementById('stage'), stageBody=document.getElementById('stageBody'),
  stageTitle=document.getElementById('stageTitle'), stageHint=document.getElementById('stageHint'),
  stageControls=document.getElementById('stageControls');
let current=null;

function openExp(id){
  const it = ITEMS.find(x=>x.id===id);
  stageTitle.textContent = it.title;
  stageBody.innerHTML='';
  stageControls.innerHTML='';
  stage.classList.add('open');
  document.body.style.overflow='hidden';
  history.pushState({expOpen:true, id}, '', `#${id}`);
  current = EXPERIENCES[id];
  current.mount(stageBody, stageHint);
}

function closeExp(fromHistory = false){
  if(!stage.classList.contains('open')) return;
  stage.classList.remove('open');
  document.body.style.overflow='';
  if(current && current.unmount) current.unmount();
  current=null;
  if(!fromHistory && window.location.hash){
    history.back();
  }
}

document.getElementById('backBtn').addEventListener('click', ()=>closeExp(false));
window.addEventListener('popstate', ()=>closeExp(true));
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&stage.classList.contains('open')) closeExp(false); });

function makeCanvasWrap(){
  const wrap=document.createElement('div'); wrap.className='exp-canvas-wrap';
  const canvas=document.createElement('canvas'); wrap.appendChild(canvas);
  stageBody.appendChild(wrap);
  function resize(){
    const r=wrap.getBoundingClientRect();
    canvas.width=r.width*(window.devicePixelRatio||1); 
    canvas.height=r.height*(window.devicePixelRatio||1);
  }
  resize();
  window.addEventListener('resize', resize);
  return {wrap, canvas, ctx:canvas.getContext('2d'), resize};
}
function addCtrlRow(){
  return stageControls;
}
function pillBtn(label,onClick){
  const b=document.createElement('button'); b.className='pill-btn'; b.textContent=label;
  b.addEventListener('click',onClick); return b;
}
function point(e, element){
  const r=element.getBoundingClientRect(), source=e.touches?.[0]||e.changedTouches?.[0]||e;
  return {x:(source.clientX-r.left)*element.width/r.width, y:(source.clientY-r.top)*element.height/r.height};
}
function popAt(element, clientX, clientY, colors=['#A23E2E','#D6A03D','#2E6E71']){
  const r=element.getBoundingClientRect();
  for(let i=0;i<8;i++){
    const s=document.createElement('i'); s.className='spark'; s.style.left=(clientX-r.left)+'px'; s.style.top=(clientY-r.top)+'px';
    s.style.background=colors[i%colors.length]; s.style.setProperty('--x',`${(Math.random()-.5)*80}px`); s.style.setProperty('--y',`${(Math.random()-.5)*80}px`); element.parentElement.appendChild(s);
    setTimeout(()=>s.remove(),600);
  }
}

/* ============ EXPERIENCES ============ */
const EXPERIENCES = {};

/* ---- 1. SAND FOOD ---- */
EXPERIENCES.sand = {
  mount(body,hint){
    hint.textContent='Drag on the sand pot to mold and sculpt! Pour water to wet, and place fresh garnishes.';
    const {canvas,ctx,wrap}=makeCanvasWrap();
    const dpr = window.devicePixelRatio || 1;
    const status=document.createElement('div'); status.className='status'; status.textContent='Mode: Sculpt Sand'; wrap.appendChild(status);

    let activeTool = 'sculpt';
    let wetness = 0;
    let strokes = [];
    let garnishes = [];
    let drawing = false;

    function reset(){
      wetness = 0;
      strokes = [];
      garnishes = [];
      activeTool = 'sculpt';
      status.textContent = 'Mode: Sculpt Sand';
    }

    function handleAction(p){
      const w=canvas.width, h=canvas.height;
      const potX = w/2, potY = h*0.48, potR = Math.min(w,h)*0.36;
      if(Math.hypot(p.x-potX, p.y-potY) > potR) return;

      if(activeTool === 'sculpt'){
        strokes.push({x:p.x, y:p.y, r:16*dpr, wet:wetness});
      } else if(activeTool === 'basil' || activeTool === 'flower'){
        garnishes.push({x:p.x, y:p.y, type:activeTool, rot:(Math.random()-0.5)*0.8});
      }
    }

    canvas.addEventListener('pointerdown', e=>{
      drawing=true; 
      handleAction(point(e,canvas));
    });
    canvas.addEventListener('pointermove', e=>{
      if(drawing && activeTool==='sculpt') handleAction(point(e,canvas));
    });
    window.addEventListener('pointerup', ()=>drawing=false);

    let raf;
    function render(){
      const w=canvas.width, h=canvas.height;
      ctx.fillStyle='#f5eedc'; ctx.fillRect(0,0,w,h);

      const potX = w/2, potY = h*0.48, potR = Math.min(w,h)*0.36;

      ctx.beginPath(); ctx.arc(potX, potY+6*dpr, potR+14*dpr, 0, Math.PI*2);
      ctx.fillStyle = 'rgba(0,0,0,0.1)'; ctx.fill();

      ctx.beginPath(); ctx.arc(potX, potY, potR+14*dpr, 0, Math.PI*2);
      ctx.fillStyle = '#9e472a'; ctx.fill();
      ctx.lineWidth=5*dpr; ctx.strokeStyle='#662c17'; ctx.stroke();

      ctx.beginPath(); ctx.arc(potX, potY, potR, 0, Math.PI*2);
      const baseSand = wetness > 0.4 ? '#9c7b4c' : '#dfc48c';
      ctx.fillStyle = baseSand; ctx.fill();

      for(let i=0; i<60; i++){
        const a = (i*137.5)*Math.PI/180;
        const dist = (i%20)*potR/21;
        ctx.fillStyle = wetness>0.3?'rgba(90,60,30,0.25)':'rgba(160,130,80,0.3)';
        ctx.fillRect(potX+Math.cos(a)*dist, potY+Math.sin(a)*dist, 2.5*dpr, 2.5*dpr);
      }

      strokes.forEach(s=>{
        ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
        ctx.fillStyle = s.wet > 0.4 ? 'rgba(110,80,45,0.45)' : 'rgba(195,165,110,0.55)';
        ctx.fill();
      });

      garnishes.forEach(g=>{
        ctx.save(); ctx.translate(g.x, g.y); ctx.rotate(g.rot);
        if(g.type==='basil'){
          ctx.fillStyle='#2e7d32';
          ctx.beginPath(); ctx.ellipse(0, -12*dpr, 8*dpr, 16*dpr, 0.3, 0, Math.PI*2); ctx.fill();
          ctx.beginPath(); ctx.ellipse(0, 12*dpr, 8*dpr, 16*dpr, -0.3, 0, Math.PI*2); ctx.fill();
          ctx.strokeStyle='#1b5e20'; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(0,-18*dpr); ctx.lineTo(0,18*dpr); ctx.stroke();
        } else {
          ctx.fillStyle='#e91e63';
          for(let i=0; i<5; i++){
            ctx.rotate(Math.PI*2/5);
            ctx.beginPath(); ctx.ellipse(0, 11*dpr, 6*dpr, 9*dpr, 0, 0, Math.PI*2); ctx.fill();
          }
          ctx.beginPath(); ctx.arc(0,0,5*dpr,0,Math.PI*2); ctx.fillStyle='#ffeb3b'; ctx.fill();
        }
        ctx.restore();
      });

      raf = requestAnimationFrame(render);
    }
    render();

    const row=addCtrlRow();
    row.appendChild(pillBtn('🖐️ Sculpt', ()=>{activeTool='sculpt'; status.textContent='Mode: Sculpt Sand';}));
    row.appendChild(pillBtn('💧 Pour Water', ()=>{
      wetness = Math.min(1, wetness + 0.3);
      strokes.forEach(s=>s.wet = Math.min(1, s.wet + 0.3));
      status.textContent=`Moisture: ${Math.round(wetness*100)}%`;
    }));
    row.appendChild(pillBtn('🌿 Basil', ()=>{activeTool='basil'; status.textContent='Mode: Place Basil';}));
    row.appendChild(pillBtn('🌸 Flower', ()=>{activeTool='flower'; status.textContent='Mode: Place Flower';}));
    row.appendChild(pillBtn('↺ Reset', reset));

    this._cleanup=()=>cancelAnimationFrame(raf);
  },
  unmount(){ if(this._cleanup) this._cleanup(); }
};

/* ---- 2. WATER TUB SWIRL ---- */
EXPERIENCES.swirl = {
  mount(body,hint){
    hint.textContent='Drag & swirl in circles inside the tub!';
    const {canvas,ctx}=makeCanvasWrap();
    const dpr = window.devicePixelRatio || 1;
    let particles=[], raf, swirlVelocity=0, lastAngle=null, lastTime=Date.now();

    function reset(){
      particles=[]; swirlVelocity=0;
      const w=canvas.width, h=canvas.height;
      for(let i=0;i<180;i++){
        const r = Math.random()*Math.min(w,h)*0.4;
        const a = Math.random()*Math.PI*2;
        particles.push({r, a, size:2+Math.random()*3});
      }
    }
    reset();

    let dragging=false;
    canvas.addEventListener('pointerdown', e=>{dragging=true; lastAngle=null;});
    window.addEventListener('pointerup', ()=>dragging=false);
    canvas.addEventListener('pointermove', e=>{
      if(!dragging) return;
      const p=point(e,canvas);
      const cx=canvas.width/2, cy=canvas.height/2;
      const ang=Math.atan2(p.y-cy, p.x-cx);
      const now=Date.now();
      const dt=Math.max(1, now-lastTime);
      if(lastAngle!==null){
        let d = ang-lastAngle;
        while(d > Math.PI) d -= Math.PI*2;
        while(d < -Math.PI) d += Math.PI*2;
        swirlVelocity += (d / dt) * 12;
      }
      lastAngle=ang; lastTime=now;
    });

    function loop(){
      const w=canvas.width, h=canvas.height, cx=w/2, cy=h/2;
      ctx.fillStyle='#d6edee'; ctx.fillRect(0,0,w,h);

      const tubR = Math.min(w,h)*0.44;
      ctx.beginPath(); ctx.arc(cx,cy,tubR+8*dpr,0,Math.PI*2);
      ctx.fillStyle='#98bcc0'; ctx.fill();
      ctx.beginPath(); ctx.arc(cx,cy,tubR,0,Math.PI*2);
      ctx.fillStyle='#bfe4e7'; ctx.fill();

      const centerDepress = Math.min(22*dpr, Math.abs(swirlVelocity)*3);
      ctx.beginPath(); ctx.arc(cx,cy,Math.max(4, centerDepress),0,Math.PI*2);
      ctx.fillStyle='rgba(40,110,120,0.5)'; ctx.fill();

      swirlVelocity *= 0.982;

      particles.forEach(p=>{
        p.a += (swirlVelocity * 0.05) / (p.r/60 + 1);
        if(Math.abs(swirlVelocity) > 0.05){
          p.r -= Math.sign(swirlVelocity) * 0.08 * (1 - p.r/tubR);
          if(p.r < 8) p.r = tubR * (0.5 + Math.random()*0.45);
        }
        const x = cx + Math.cos(p.a)*p.r;
        const y = cy + Math.sin(p.a)*p.r*0.92;
        ctx.beginPath(); ctx.arc(x,y,p.size*dpr,0,Math.PI*2);
        ctx.fillStyle='rgba(35, 115, 125, 0.45)'; ctx.fill();
      });

      raf=requestAnimationFrame(loop);
    }
    loop();

    const row=addCtrlRow();
    row.appendChild(pillBtn('↺ Still Water', reset));
    row.appendChild(pillBtn('↻ Push Clockwise', ()=>{swirlVelocity+=2.5;}));
    row.appendChild(pillBtn('↺ Push Counter', ()=>{swirlVelocity-=2.5;}));

    this._cleanup=()=>cancelAnimationFrame(raf);
  },
  unmount(){ if(this._cleanup) this._cleanup(); }
};

/* ---- 3. RAIN RACE ---- */
EXPERIENCES.rain = {
  mount(body,hint){
    hint.textContent='Tap a drop to speed it up — race it to the bottom.';
    const {canvas,ctx,wrap}=makeCanvasWrap();
    const dpr = window.devicePixelRatio || 1;

EXPERIENCES.pambaram = {
  mount(body,hint){
    hint.textContent='Drag the cord knob right/down and release to spin!';
    const {canvas,ctx}=makeCanvasWrap();
    const dpr = window.devicePixelRatio || 1;
    let raf, spin=0, wobble=0, cordPull=0, isDraggingCord=false, startCordY=0;

    canvas.addEventListener('pointerdown', e=>{
      const p=point(e,canvas);
      if(p.x > canvas.width*0.5 && p.y > canvas.height*0.35){
        isDraggingCord=true;
        startCordY=e.clientY;
      }
    });
    window.addEventListener('pointerup', e=>{
      if(isDraggingCord){
        spin += cordPull * 0.35;
        cordPull = 0;
        isDraggingCord = false;
      }
    });
    canvas.addEventListener('pointermove', e=>{
      if(isDraggingCord){
        cordPull = Math.max(0, Math.min(120, e.clientY - startCordY));
      }
    });

    function loop(){
      const w=canvas.width, h=canvas.height;
      ctx.fillStyle='#fbf6eb'; ctx.fillRect(0,0,w,h);

      const groundY = h*0.76;
      ctx.fillStyle='#d5c49d'; ctx.fillRect(0,groundY,w,h-groundY);
      ctx.strokeStyle='rgba(0,0,0,0.1)'; ctx.beginPath(); ctx.moveTo(0,groundY); ctx.lineTo(w,groundY); ctx.stroke();

      spin *= 0.991;
      if(spin < 0.05) spin = 0;
      wobble = spin > 0.1 ? Math.sin(Date.now()*0.015) * Math.max(0, (5-spin)*2.5) : 15;

      const topX = w*0.45;
      const topY = groundY - 8*dpr;

      ctx.save();
      ctx.translate(topX, topY);
      ctx.rotate((wobble * Math.PI) / 180);

      ctx.fillStyle='#4a4a4a';
      ctx.beginPath();
      ctx.moveTo(-4*dpr, 0);
      ctx.lineTo(4*dpr, 0);
      ctx.lineTo(0, 10*dpr);
      ctx.closePath(); ctx.fill();

      const topH = 95*dpr;
      const topW = 65*dpr;

      const grad=ctx.createLinearGradient(-topW/2, 0, topW/2, 0);
      grad.addColorStop(0,'#b45309');
      grad.addColorStop(0.3,'#f59e0b');
      grad.addColorStop(0.7,'#d97706');
      grad.addColorStop(1,'#78350f');

      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.bezierCurveTo(-topW*0.6, -topH*0.35, -topW*0.6, -topH*0.8, 0, -topH*0.95);
      ctx.bezierCurveTo(topW*0.6, -topH*0.8, topW*0.6, -topH*0.35, 0, 0);
      ctx.fillStyle=grad; ctx.fill();
      ctx.strokeStyle='#5a2c07'; ctx.lineWidth=2*dpr; ctx.stroke();

      ctx.strokeStyle='#A23E2E'; ctx.lineWidth=5*dpr;
      ctx.beginPath(); ctx.ellipse(0, -topH*0.6, topW*0.45, 7*dpr, 0, 0, Math.PI); ctx.stroke();
      ctx.strokeStyle='#2E6E71'; ctx.lineWidth=3*dpr;
      ctx.beginPath(); ctx.ellipse(0, -topH*0.4, topW*0.32, 5*dpr, 0, 0, Math.PI); ctx.stroke();

      ctx.fillStyle='#78350f';
      ctx.beginPath(); ctx.ellipse(0, -topH*0.96, 10*dpr, 4*dpr, 0, 0, Math.PI*2); ctx.fill();

      ctx.restore();

      const cordStartX = topX + 12*dpr;
      const cordStartY = groundY - 45*dpr;
      const cordEndX = topX + 80*dpr + cordPull*1.6;
      const cordEndY = groundY - 18*dpr + cordPull;

      ctx.beginPath();
      ctx.moveTo(cordStartX, cordStartY);
      ctx.quadraticCurveTo(cordStartX+30, cordStartY+15+cordPull*0.4, cordEndX, cordEndY);
      ctx.strokeStyle='#e6dfc8'; ctx.lineWidth=3.5*dpr; ctx.stroke();

      ctx.beginPath(); ctx.arc(cordEndX, cordEndY, 8*dpr, 0, Math.PI*2);
      ctx.fillStyle='#A23E2E'; ctx.fill();

      ctx.fillStyle='#5b5344'; ctx.font=`${11*dpr}px 'Space Mono'`;
      ctx.fillText(spin>0.5 ? `Spinning fast: ${Math.round(spin*20)} RPM` : 'Pull string & release!', 12*dpr, 20*dpr);

      raf=requestAnimationFrame(loop);
    }
    loop();

    const row=addCtrlRow();
    row.appendChild(pillBtn('⚡ Hard Pull', ()=>{spin+=14;}));
    row.appendChild(pillBtn('↺ Reset Top', ()=>{spin=0;}));

    this._cleanup=()=>cancelAnimationFrame(raf);
  },
  unmount(){ if(this._cleanup) this._cleanup(); }
};

/* ---- 9. CYLINDRICAL MAGNETS (PHYSICS RE-ENGINEERED) ---- */
EXPERIENCES.magnets = {
  mount(body,hint){
    hint.textContent='Drag the magnets! Opposites (N-S) attract & snap; Likes (N-N / S-S) push away!';
    const wrap=document.createElement('div'); wrap.className='exp-canvas-wrap'; wrap.style.background='#fdf7ea';
    stageBody.appendChild(wrap);
    const status=document.createElement('div'); status.className='status'; status.textContent='Drag them close…'; wrap.appendChild(status);

    const isMobile = window.innerWidth < 560;
    const MAG_W = isMobile ? 100 : 124, MAG_H = isMobile ? 38 : 44;

    function makeCylinderMag(x, y, flipped){
      const el=document.createElement('div');
      el.style.cssText=`position:absolute; left:${x}px; top:${y}px; width:${MAG_W}px; height:${MAG_H}px; border-radius:${MAG_H/2}px;
        display:flex; cursor:grab; box-shadow:0 6px 14px rgba(0,0,0,.22); user-select:none; touch-action:none; border:2px solid #222; overflow:hidden; z-index:5;`;
      
      const p1=document.createElement('div'), p2=document.createElement('div');
      [p1,p2].forEach(p=>{ p.style.cssText=`flex:1; display:flex; align-items:center; justify-content:center; color:#fff; font-family:Space Mono; font-weight:bold; font-size:${isMobile?11:13}px; text-shadow:0 1px 2px rgba(0,0,0,0.6);`; });
      
      function updatePoles(){
        if(!el.flipped){
          p1.style.background='linear-gradient(180deg, #dc2626, #991b1b)'; p1.textContent='N';
          p2.style.background='linear-gradient(180deg, #0284c7, #075985)'; p2.textContent='S';
        } else {
          p1.style.background='linear-gradient(180deg, #0284c7, #075985)'; p1.textContent='S';
          p2.style.background='linear-gradient(180deg, #dc2626, #991b1b)'; p2.textContent='N';
        }
      }
      el.flipped = flipped;
      updatePoles();
      el.appendChild(p1); el.appendChild(p2);
      wrap.appendChild(el);
      el.updatePoles = updatePoles;
      return el;
    }

    const m1=makeCylinderMag(20, 80, false);
    const m2=makeCylinderMag(isMobile?150:240, 120, false);

    function clampBounds(el){
      const wr=wrap.getBoundingClientRect();
      let x = parseFloat(el.style.left)||0;
      let y = parseFloat(el.style.top)||0;
      x = Math.max(4, Math.min(wr.width - MAG_W - 4, x));
      y = Math.max(4, Math.min(wr.height - MAG_H - 4, y));
      el.style.left = x + 'px';
      el.style.top = y + 'px';
      return {x, y};
    }

    function checkPhysics(active){
      clampBounds(m1); clampBounds(m2);
      const r1=m1.getBoundingClientRect(), r2=m2.getBoundingClientRect();
      
      // Calculate pole points (Left and Right ends of each magnet)
      const m1_leftPole = { x: r1.left + MAG_W*0.25, y: r1.top + MAG_H*0.5, name: m1.flipped ? 'S' : 'N' };
      const m1_rightPole = { x: r1.left + MAG_W*0.75, y: r1.top + MAG_H*0.5, name: m1.flipped ? 'N' : 'S' };

      const m2_leftPole = { x: r2.left + MAG_W*0.25, y: r2.top + MAG_H*0.5, name: m2.flipped ? 'S' : 'N' };
      const m2_rightPole = { x: r2.left + MAG_W*0.75, y: r2.top + MAG_H*0.5, name: m2.flipped ? 'N' : 'S' };

      // Find the two closest interacting poles between the two magnets
      const pairs = [
        { p1: m1_leftPole, p2: m2_leftPole, d: Math.hypot(m1_leftPole.x - m2_leftPole.x, m1_leftPole.y - m2_leftPole.y) },
        { p1: m1_leftPole, p2: m2_rightPole, d: Math.hypot(m1_leftPole.x - m2_rightPole.x, m1_leftPole.y - m2_rightPole.y) },
        { p1: m1_rightPole, p2: m2_leftPole, d: Math.hypot(m1_rightPole.x - m2_leftPole.x, m1_rightPole.y - m2_leftPole.y) },
        { p1: m1_rightPole, p2: m2_rightPole, d: Math.hypot(m1_rightPole.x - m2_rightPole.x, m1_rightPole.y - m2_rightPole.y) }
      ];

      pairs.sort((a,b)=>a.d - b.d);
      const closest = pairs[0];
      const dist = closest.d;
      const attracts = (closest.p1.name !== closest.p2.name); // Opposites attract, Likes repel

      const threshold = isMobile ? 140 : 180;

      if(dist < threshold){
        const force = Math.min(20, (1 - dist/threshold) * 22);
        const other = active === m1 ? m2 : m1;
        
        let ox = parseFloat(other.style.left)||0;
        let oy = parseFloat(other.style.top)||0;

        const c1={x:r1.left+r1.width/2, y:r1.top+r1.height/2};
        const c2={x:r2.left+r2.width/2, y:r2.top+r2.height/2};
        const dx = c2.x - c1.x;
        const dy = c2.y - c1.y;
        const centerDist = Math.hypot(dx, dy) || 1;

        const dirX = (dx / centerDist) * (active === m1 ? 1 : -1);
        const dirY = (dy / centerDist) * (active === m1 ? 1 : -1);

        if(attracts){
          status.textContent = dist < 70 ? `🧲 SNAP! Opposite poles (${closest.p1.name} & ${closest.p2.name}) attracted!` : 'Attracting together…';
          other.style.left = (ox + dirX * force) + 'px';
          other.style.top = (oy + dirY * force * 0.4) + 'px';
        } else {
          status.textContent = `↔ REPEL! Like poles (${closest.p1.name} & ${closest.p2.name}) push apart!`;
          other.style.left = (ox - dirX * force * 1.3) + 'px';
          other.style.top = (oy - dirY * force * 0.6) + 'px';
        }
        clampBounds(other);
      } else {
        status.textContent = 'Move magnets close to test magnetic poles';
      }
    }

    [m1,m2].forEach(el=>{
      let dragging=false, ox=0, oy=0;
      el.addEventListener('pointerdown', e=>{
        const wr=wrap.getBoundingClientRect();
        dragging=true; ox=e.clientX-wr.left-el.offsetLeft; oy=e.clientY-wr.top-el.offsetTop;
        el.style.cursor='grabbing'; el.setPointerCapture?.(e.pointerId);
      });
      window.addEventListener('pointerup', ()=>{dragging=false; el.style.cursor='grab';});
      window.addEventListener('pointermove', e=>{
        if(!dragging) return;
        const wr=wrap.getBoundingClientRect();
        let nx=e.clientX-wr.left-ox, ny=e.clientY-wr.top-oy;
        el.style.left=nx+'px'; el.style.top=ny+'px';
        checkPhysics(el);
      });
    });

    const row=addCtrlRow();
    row.appendChild(pillBtn('🔀 Flip Left Magnet', ()=>{m1.flipped=!m1.flipped; m1.updatePoles(); checkPhysics(m1);}));
    row.appendChild(pillBtn('🔀 Flip Right Magnet', ()=>{m2.flipped=!m2.flipped; m2.updatePoles(); checkPhysics(m2);}));

    this._cleanup=()=>{};
  },
  unmount(){ if(this._cleanup) this._cleanup(); }
};

/* ---- 10. CHIPS ON FINGERS (CLEAN, SOLID HAND) ---- */
EXPERIENCES.chips = {
  mount(body,hint){
    hint.textContent='Drag each cone chip onto the 5 fingertips!';
    const {canvas,ctx,wrap}=makeCanvasWrap();
    const dpr = window.devicePixelRatio || 1;
    const status=document.createElement('div'); status.className='status'; status.textContent='Chips on hand: 0 / 5'; wrap.appendChild(status);
    const celebrate=document.createElement('div'); celebrate.className='celebrate'; wrap.appendChild(celebrate);

    let chips = [];
    let draggedChip = null;

    function initChips(){
      chips = [];
      const w=canvas.width, h=canvas.height;
      const step = w / 6;
      for(let i=0; i<5; i++){
        chips.push({
          id: i,
          x: step * (i + 1),
          y: h * 0.86,
          homeX: step * (i + 1),
          homeY: h * 0.86,
          fingerIdx: null
        });
      }
      celebrate.classList.remove('show');
      status.textContent='Chips on hand: 0 / 5';
    }

    function getFingerTips(){
      const w=canvas.width, h=canvas.height;
      const s = Math.min(w/440, h/320);
      const cx = w * 0.5, cy = h * 0.52;
      return [
        {x: cx - 78*s, y: cy - 28*s, name:'Thumb', angle: -0.65},
        {x: cx - 40*s, y: cy - 90*s, name:'Index', angle: -0.2},
        {x: cx + 0*s,  y: cy - 108*s, name:'Middle', angle: 0},
        {x: cx + 40*s, y: cy - 88*s, name:'Ring', angle: 0.2},
        {x: cx + 76*s, y: cy - 40*s, name:'Pinky', angle: 0.5}
      ];
    }

    initChips();

    canvas.addEventListener('pointerdown', e=>{
      const p=point(e,canvas);
      chips.forEach(c=>{
        if(Math.hypot(p.x - c.x, p.y - c.y) < 32*dpr){
          draggedChip = c;
          c.fingerIdx = null;
        }
      });
    });

    window.addEventListener('pointerup', ()=>{
      if(draggedChip){
        const tips = getFingerTips();
        let snapped = false;
        tips.forEach((tip, idx)=>{
          if(Math.hypot(draggedChip.x - tip.x, draggedChip.y - tip.y) < 36*dpr){
            chips.forEach(other=>{ if(other.fingerIdx === idx) other.fingerIdx = null; });
            draggedChip.x = tip.x;
            draggedChip.y = tip.y;
            draggedChip.fingerIdx = idx;
            snapped = true;
          }
        });
        if(!snapped && draggedChip.y < canvas.height*0.7){
          draggedChip.x = draggedChip.homeX;
          draggedChip.y = draggedChip.homeY;
        }
        draggedChip = null;

        const count = chips.filter(c=>c.fingerIdx!==null).length;
        status.textContent = `Chips on hand: ${count} / 5`;
        if(count === 5){
          celebrate.textContent = '🧤 Witch Claws Activated!';
          celebrate.classList.add('show');
        }
      }
    });

    canvas.addEventListener('pointermove', e=>{
      if(draggedChip){
        const p=point(e,canvas);
        draggedChip.x = p.x;
        draggedChip.y = p.y;
      }
    });

    let raf;
    function render(){
      const w=canvas.width, h=canvas.height;
      ctx.fillStyle='#f7f2e7'; ctx.fillRect(0,0,w,h);

      const s = Math.min(w/440, h/320);
      const cx = w * 0.5, cy = h * 0.52;
      const skin = '#cf9170';
      const skinShade = '#a86a4c';
      const skinNail = '#dfa98e';

      // 1. Draw Entire Solid Hand as a Continuous Contour (No seams/tears)
      ctx.fillStyle = skin;
      ctx.strokeStyle = skinShade;
      ctx.lineWidth = 3*dpr;
      ctx.lineJoin = 'round';
      ctx.lineCap = 'round';

      ctx.beginPath();
      // Start at left wrist
      ctx.moveTo(cx - 36*s, cy + 130*s);
      ctx.lineTo(cx - 38*s, cy + 60*s);
      
      // Thumb outer contour
      ctx.quadraticCurveTo(cx - 62*s, cy + 30*s, cx - 82*s, cy - 20*s);
      ctx.arc(cx - 78*s, cy - 28*s, 9*s, Math.PI*0.8, -Math.PI*0.1);
      ctx.quadraticCurveTo(cx - 52*s, cy - 8*s, cx - 44*s, cy - 20*s); // Thumb web

      // Index finger
      ctx.lineTo(cx - 48*s, cy - 80*s);
      ctx.arc(cx - 40*s, cy - 90*s, 8.5*s, Math.PI, 0);
      ctx.lineTo(cx - 31*s, cy - 28*s); // Index-middle web

      // Middle finger
      ctx.lineTo(cx - 10*s, cy - 98*s);
      ctx.arc(cx + 0*s, cy - 108*s, 9*s, Math.PI, 0);
      ctx.lineTo(cx + 10*s, cy - 28*s); // Middle-ring web

      // Ring finger
      ctx.lineTo(cx + 31*s, cy - 78*s);
      ctx.arc(cx + 40*s, cy - 88*s, 8.5*s, Math.PI, 0);
      ctx.lineTo(cx + 48*s, cy - 20*s); // Ring-pinky web

      // Pinky finger
      ctx.lineTo(cx + 68*s, cy - 32*s);
      ctx.arc(cx + 76*s, cy - 40*s, 7.5*s, Math.PI*0.9, -Math.PI*0.1);
      ctx.quadraticCurveTo(cx + 70*s, cy + 30*s, cx + 42*s, cy + 60*s); // Outer palm edge

      // Right wrist
      ctx.lineTo(cx + 40*s, cy + 130*s);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // 2. Add Subtle Palm Crease Lines
      ctx.strokeStyle = skinShade;
      ctx.lineWidth = 2*dpr;
      
      ctx.beginPath(); // Life line
      ctx.arc(cx - 14*s, cy + 22*s, 30*s, 0.4, 1.8);
      ctx.stroke();

      ctx.beginPath(); // Head line
      ctx.arc(cx + 8*s, cy - 5*s, 36*s, 0.9, 2.1);
      ctx.stroke();

      // 3. Draw Nails
      const tips = getFingerTips();
      ctx.fillStyle = skinNail;
      tips.forEach(t=>{
        ctx.beginPath();
        ctx.arc(t.x, t.y + 2*s, 4.5*s, 0, Math.PI*2);
        ctx.fill();
      });

      // 4. Bottom Tray
      ctx.fillStyle='#e6dbc5'; ctx.fillRect(0, h*0.76, w, h*0.24);
      ctx.strokeStyle='rgba(0,0,0,0.1)'; ctx.strokeRect(0, h*0.76, w, h*0.24);

      // 5. Render Cone Chips
      chips.forEach(c=>{
        ctx.save();
        ctx.translate(c.x, c.y);
        
        let chipRot = 0;
        if(c.fingerIdx !== null){
          chipRot = tips[c.fingerIdx].angle;
        }
        ctx.rotate(chipRot);

        const chipW = 10*dpr, chipH = 26*dpr;
        
        ctx.fillStyle='rgba(0,0,0,0.12)';
        ctx.beginPath();
        ctx.ellipse(0, chipH*0.45, chipW*1.1, chipW*0.35, 0, 0, Math.PI*2);
        ctx.fill();

        ctx.fillStyle='#eab308';
        ctx.strokeStyle='#ca8a04'; ctx.lineWidth=1.5;

        ctx.beginPath();
        ctx.moveTo(-chipW, chipH*0.35);
        ctx.lineTo(chipW, chipH*0.35);
        ctx.lineTo(0, -chipH*0.65);
        ctx.closePath();
        ctx.fill(); ctx.stroke();

        ctx.strokeStyle='rgba(161, 98, 7, 0.4)';
        ctx.lineWidth=1;
        for(let l = -chipH*0.3; l <= chipH*0.2; l += 5*dpr){
          ctx.beginPath();
          ctx.moveTo(-chipW * (1 - (l+chipH*0.3)/chipH), l);
          ctx.lineTo(chipW * (1 - (l+chipH*0.3)/chipH), l);
          ctx.stroke();
        }

        ctx.beginPath();
        ctx.ellipse(0, chipH*0.35, chipW, chipW*0.35, 0, 0, Math.PI*2);
        ctx.fillStyle='#78350f'; ctx.fill();
        ctx.stroke();

        ctx.restore();
      });

      raf=requestAnimationFrame(render);
    }
    render();

    const row=addCtrlRow();
    row.appendChild(pillBtn('↺ Reset Chips', initChips));

    this._cleanup=()=>cancelAnimationFrame(raf);
  },
  unmount(){ if(this._cleanup) this._cleanup(); }
};

/* ---- 11. WATER BOTTLE TORNADO ---- */
EXPERIENCES.tornado = {
  mount(body,hint){
    hint.textContent='Spin finger/mouse fast in circles inside the bottle to form vortex!';
    const {canvas,ctx}=makeCanvasWrap();
    const dpr = window.devicePixelRatio || 1;
    let raf, particles=[], vortexForce=0, lastAngle=null, lastTime=Date.now();

    function reset(){
      particles=[]; vortexForce=0;
      const w=canvas.width, h=canvas.height;
      for(let i=0; i<150; i++){
        particles.push({
          x: w*0.5 + (Math.random()-0.5)*w*0.22,
          y: h*0.28 + Math.random()*h*0.52,
          a: Math.random()*Math.PI*2,
          r: 5 + Math.random()*40
        });
      }
    }
    reset();

    let pressing=false;
    canvas.addEventListener('pointerdown', ()=>{pressing=true; lastAngle=null;});
    window.addEventListener('pointerup', ()=>pressing=false);
    canvas.addEventListener('pointermove', e=>{
      if(!pressing) return;
      const p=point(e,canvas);
      const cx=canvas.width/2, cy=canvas.height/2;
      const ang=Math.atan2(p.y-cy, p.x-cx);
      const now=Date.now();
      const dt=Math.max(1, now-lastTime);
      if(lastAngle!==null){
        let d = ang-lastAngle;
        while(d > Math.PI) d -= Math.PI*2;
        while(d < -Math.PI) d += Math.PI*2;
        vortexForce = Math.min(18, vortexForce + Math.abs(d/dt)*22);
      }
      lastAngle=ang; lastTime=now;
    });

    function loop(){
      const w=canvas.width, h=canvas.height;
      const cx=w/2;
      ctx.fillStyle='#f0f7f8'; ctx.fillRect(0,0,w,h);

      vortexForce *= 0.985;

      const bw = Math.min(w*0.38, 160*dpr), bh = h*0.75, bx = cx - bw/2, by = h*0.14;
      
      ctx.fillStyle='#0284c7'; ctx.fillRect(cx-12*dpr, by-16*dpr, 24*dpr, 16*dpr);

      ctx.fillStyle='rgba(224, 242, 254, 0.65)';
      ctx.strokeStyle='#7dd3fc'; ctx.lineWidth=3*dpr;
      ctx.beginPath();
      ctx.roundRect(bx, by, bw, bh, [16*dpr, 16*dpr, 10*dpr, 10*dpr]);
      ctx.fill(); ctx.stroke();

      ctx.fillStyle='rgba(186, 230, 253, 0.45)';
      ctx.fillRect(bx+3, by+bh*0.15, bw-6, bh*0.84);

      if(vortexForce > 1.2){
        ctx.beginPath();
        const topFunnelW = Math.min(bw*0.4, vortexForce*4.5*dpr);
        ctx.moveTo(cx - topFunnelW, by+bh*0.18);
        ctx.lineTo(cx + topFunnelW, by+bh*0.18);
        ctx.lineTo(cx + 3*dpr, by+bh*0.75);
        ctx.lineTo(cx - 3*dpr, by+bh*0.75);
        ctx.closePath();
        ctx.fillStyle='rgba(255, 255, 255, 0.7)'; ctx.fill();
        ctx.strokeStyle='rgba(14, 165, 233, 0.6)'; ctx.stroke();
      }

      particles.forEach(p=>{
        p.a += 0.02 + vortexForce*0.06;
        const currentR = p.r * (1 + vortexForce*0.08);
        const px = cx + Math.cos(p.a) * Math.min(bw*0.42, currentR);
        const py = p.y + Math.sin(p.a) * 3.5;
        ctx.beginPath(); ctx.arc(px, py, 2*dpr, 0, Math.PI*2);
        ctx.fillStyle='rgba(14, 165, 233, 0.65)'; ctx.fill();
      });

      ctx.fillStyle='#5b5344'; ctx.font=`${11*dpr}px 'Space Mono'`;
      ctx.fillText(vortexForce>3 ? '🌪️ TORNADO ACTIVE!' : 'Swirl circles to build tornado', 12*dpr, 20*dpr);

      raf=requestAnimationFrame(loop);
    }
    loop();

    const row=addCtrlRow();
    row.appendChild(pillBtn('🌪️ Spin Hard', ()=>{vortexForce+=8;}));
    row.appendChild(pillBtn('↺ Still Bottle', reset));

    this._cleanup=()=>cancelAnimationFrame(raf);
  },
  unmount(){ if(this._cleanup) this._cleanup(); }
};

/* ---- 12. PEEL THE GUM (GLUE HEART PEEL) ---- */
EXPERIENCES.gum = {
  mount(body,hint){
    hint.textContent='Tap pour glue on the hand, wait 10 seconds to dry, then peel it slowly!';
    const {canvas,ctx,wrap}=makeCanvasWrap();
    const dpr = window.devicePixelRatio || 1;
    const status=document.createElement('div'); status.className='status'; status.textContent='Step 1: Pour glue on hand'; wrap.appendChild(status);
    const celebrate=document.createElement('div'); celebrate.className='celebrate'; wrap.appendChild(celebrate);

    let state = 'POUR';
    let pourProgress = 0;
    let dryTimer = 10;
    let dryInterval = null;
    let peel = 0;
    let torn = false;
    let dragging = false;
    let lastY = 0;
    let bottlePos = {x:0, y:0};

    function reset(){
      state = 'POUR';
      pourProgress = 0;
      dryTimer = 10;
      peel = 0;
      torn = false;
      if(dryInterval) clearInterval(dryInterval);
      celebrate.classList.remove('show');
      status.textContent='Step 1: Pour glue on hand';
    }
    reset();

    canvas.addEventListener('pointerdown', e=>{
      if(state==='POUR'){
        pourProgress += 25;
        status.textContent=`Pouring glue: ${pourProgress}%`;
        if(pourProgress >= 100){
          state = 'DRYING';
          status.textContent=`Drying... wait ${dryTimer}s`;
          dryInterval = setInterval(()=>{
            dryTimer--;
            if(dryTimer <= 0){
              clearInterval(dryInterval);
              state = 'READY_TO_PEEL';
              status.textContent='Ready! Drag up gently to peel the heart.';
            } else {
              status.textContent=`Drying... wait ${dryTimer}s`;
            }
          }, 1000);
        }
      } else if(state==='READY_TO_PEEL'){
        dragging = true;
        lastY = e.clientY;
      }
    });

    window.addEventListener('pointerup', ()=>{dragging=false;});
    canvas.addEventListener('pointermove', e=>{
      const p=point(e,canvas);
      bottlePos = {x:p.x, y:p.y};
      if(dragging && state==='READY_TO_PEEL'){
        const dy = lastY - e.clientY;
        lastY = e.clientY;
        if(dy > 0){
          if(dy > 18){
            torn = true;
            state = 'TORN';
            status.textContent = '💔 It tore! You peeled too fast.';
          } else {
            peel += dy * 1.5;
            status.textContent = `Peeling: ${Math.min(100, Math.round(peel))}%`;
            if(peel >= 100){
              state = 'PEELED';
              celebrate.textContent = '🎉 Perfect Heart Peeled Whole!';
              celebrate.classList.add('show');
            }
          }
        }
      }
    });

    let raf;
    function render(){
      const w=canvas.width, h=canvas.height;
      ctx.fillStyle='#f9f4ea'; ctx.fillRect(0,0,w,h);

      const hx = w*0.5, hy = h*0.54;
      ctx.fillStyle='#8d5b4c';
      ctx.beginPath(); ctx.ellipse(hx, hy, w*0.22, h*0.26, 0, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle='#6e4438'; ctx.lineWidth=3*dpr; ctx.stroke();

      if(pourProgress > 0){
        ctx.save();
        ctx.translate(hx, hy - 10*dpr);
        const scale = (Math.min(100, pourProgress)/100) * dpr;
        ctx.scale(scale, scale);

        ctx.beginPath();
        ctx.moveTo(0, 15);
        ctx.bezierCurveTo(-35, -20, -35, -55, 0, -30);
        ctx.bezierCurveTo(35, -55, 35, -20, 0, 15);

        if(state === 'POUR' || state === 'DRYING'){
          ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
        } else if(state === 'READY_TO_PEEL'){
          ctx.fillStyle = 'rgba(255, 255, 255, 0.45)';
        } else if(state === 'TORN'){
          ctx.fillStyle = 'rgba(239, 68, 68, 0.35)';
        }
        ctx.fill();
        ctx.strokeStyle = '#ffffff'; ctx.lineWidth=2; ctx.stroke();

        if(peel > 0 && !torn){
          ctx.beginPath();
          ctx.arc(0, -20 - peel*0.4, 20*dpr, 0, Math.PI);
          ctx.fillStyle='rgba(255,255,255,0.85)'; ctx.fill();
        }
        ctx.restore();
      }

      if(state === 'POUR'){
        const bx = bottlePos.x || w*0.75;
        const by = bottlePos.y || h*0.4;
        ctx.save(); ctx.translate(bx, by);
        ctx.fillStyle='#f97316'; ctx.fillRect(-14*dpr, -32*dpr, 28*dpr, 64*dpr);
        ctx.fillStyle='#ffffff'; ctx.fillRect(-7*dpr, -46*dpr, 14*dpr, 14*dpr);
        ctx.fillStyle='#ea580c'; ctx.font=`${8.5*dpr}px 'Space Mono'`; ctx.fillText('GUM', -9*dpr, 0);
        ctx.restore();
      }

      raf=requestAnimationFrame(render);
    }
    render();

    const row=addCtrlRow();
    row.appendChild(pillBtn('🧴 Pour Glue', ()=>{
      if(state==='POUR'){
        pourProgress=100;
        state='DRYING';
        dryInterval = setInterval(()=>{
          dryTimer--;
          if(dryTimer<=0){clearInterval(dryInterval); state='READY_TO_PEEL'; status.textContent='Ready! Peel slowly.';}
          else status.textContent=`Drying... wait ${dryTimer}s`;
        }, 1000);
      }
    }));
    row.appendChild(pillBtn('↺ Reset Hand', reset));

    this._cleanup=()=>{if(dryInterval) clearInterval(dryInterval); cancelAnimationFrame(raf);};
  },
  unmount(){ if(this._cleanup) this._cleanup(); }
};
</script>
